# Pages CMS: 公開リポジトリを編集します。秘密の下書き・回答データは保存しません。
media:
  input: assets/images
  output: assets/images
  extensions:
  - webp
  - avif
  - jpg
  - jpeg
  - png
  categories:
  - image
content:
- name: site
  label: サイト設定・SNS
  type: file
  path: data/site.json
  format: json
  fields:
  - name: name
    label: サイト名
    type: string
  - name: description
    label: サイトの説明
    type: string
  - name: url
    label: 公開URL（末尾 /）
    type: string
  - name: season
    label: シーズン
    type: string
  - name: category
    label: 参戦クラス
    type: string
  - name: number
    label: ゼッケン
    type: string
  - name: team
    label: チーム
    type: string
  - name: machine
    label: マシン
    type: string
  - name: tagline
    label: キャッチコピー
    type: string
  - name: maintenanceEnabled
    label: メンテナンス画面を表示する
    type: boolean
    default: false
    description: ONで保存し公開処理が完了すると、全ページがメンテナンス案内に切り替わります。再開はOFFにして保存します。通常はOFFです。
  - name: maintenanceMessage
    label: メンテナンス中の案内文
    type: text
    description: メンテナンス画面に掲載する文章です。空欄は標準の案内文になります。
  - name: heroImage
    label: HERO・PC用写真
    type: image
    description: 実際の写真を選択してください。未設定は空欄にします。
  - name: heroMobileImage
    label: HERO・スマートフォン用写真
    type: image
    description: 実際の写真を選択してください。未設定は空欄にします。
  - name: ga4Id
    label: GA4 測定ID
    type: string
    description: 公開用の測定IDのみ（G-...）。未設定は空欄にします。秘密鍵は入力しないでください。
  - name: googleFormUrl
    label: Google Forms 埋め込みURL
    type: string
    description: Google Forms の送信 → 埋め込みHTMLの src にある https://docs.google.com/forms/... のURL。未設定は空欄にします。
  - name: googleFormHeight
    label: Google Forms の表示高さ（px）
    type: number
    description: 埋め込みHTMLの height の値。現在2081px。フォームを変更した場合はPCとスマートフォンで確認してください。
  - name: email
    label: 公開メールアドレス
    type: string
    description: 公開してよいアドレスのみ。未設定は空欄にします。
  - name: phone
    label: 公開電話番号
    type: string
    description: 公開してよい番号のみ。未設定は空欄にします。
  - name: sponsorPdf
    label: スポンサー資料PDF URL
    type: string
    description: 公開用PDFのHTTPS URLまたは相対パス。未設定は空欄にします。
  - name: socials
    label: SNSリンク
    type: object
    fields:
    - name: platform
      label: 種類
      type: select
      options:
        values:
        - instagram
        - x
        - facebook
    - name: label
      label: 表示名
      type: string
      description: SNSのサービス名です。表示はSNSの種類から自動設定するため、通常は編集不要です。
    - name: handle
      label: アカウント名
      type: string
      description: プロフィールURLが未入力の場合のみ使用する任意項目です。Instagram・XはURLを入力すると @表示もURLから自動更新します。
    - name: url
      label: プロフィールURL
      type: string
      description: 本人のプロフィールURLを入力してください。Instagram・Xの表示名とリンクを同時に更新します。Facebook未設定時は「アカウント準備中」としてFacebookのトップページへリンクします。投稿URLは指定しないでください。
    list: true
  - name: heroAlt
    label: HERO写真の説明（読み上げ用）
    type: string
    description: 実際に写っている場面を記述。未設定は空欄にします。
  - name: ogImage
    label: SNS共有用 OGP画像
    type: image
    description: 推奨1200×630px。相対パスで保存します。
  - name: photos
    label: 各セクションの写真
    type: object
    fields:
    - name: currentRace
      label: CURRENT SEASON の走行写真
      type: image
    - name: pit
      label: ピット写真
      type: image
    - name: race
      label: レース写真
      type: image
    - name: supportFeature
      label: TOP・SUPPORTの写真
      type: image
      description: TOPページのSUPPORT欄に表示する写真です。支援ページのピット写真とは別に設定できます。
- name: profile
  label: プロフィール・ストーリー
  type: file
  path: data/profile.json
  format: json
  fields:
  - name: name
    label: 氏名
    type: string
  - name: nameEn
    label: 英字氏名
    type: string
  - name: birth
    label: 生年月日
    type: string
  - name: hometown
    label: 出身地
    type: string
  - name: height
    label: 身長
    type: string
  - name: weight
    label: 体重
    type: string
  - name: shoeSize
    label: シューズサイズ
    type: string
  - name: bloodType
    label: 血液型
    type: string
  - name: favoriteFood
    label: 好きな食べ物
    type: string
  - name: hobby
    label: 趣味
    type: string
  - name: intro
    label: 紹介文
    type: text
  - name: message
    label: 池田優介からのヒトコト
    type: text
    description: 本人からのメッセージ。空行で段落を分けられます。TOPとプロフィールに同じ文章が表示されます。
  - name: messageIsSample
    label: ヒトコトを仮原稿として表示する
    type: boolean
    default: false
    description: ONの間は仮原稿であることをサイトにも表示します。内容を確認して正式掲載する際にOFFにします。非公開の下書き機能ではありません。
  - name: portraitImage
    label: プロフィール写真
    type: image
    description: 実際の写真を選択してください。未設定は空欄にします。
  - name: detailImage
    label: プロフィール・ディテール写真
    type: image
    description: 実際の写真を選択してください。未設定は空欄にします。
  - name: career
    label: 経歴・戦績
    type: object
    fields:
    - name: year
      label: 年
      type: string
    - name: title
      label: 参戦クラス・概要
      type: string
    - name: description
      label: 詳細
      type: text
    description: 確認済みの情報だけを入力。不明な情報は空欄にしてください。
    list: true
  - name: stories
    label: フォトストーリー
    type: object
    fields:
    - name: number
      label: 番号
      type: string
    - name: title
      label: 見出し
      type: string
    - name: body
      label: 本文
      type: text
    - name: image
      label: 写真
      type: image
      description: 実際の写真を選択してください。未設定は空欄にします。
    list: true
- name: races
  label: レース予定・結果
  type: file
  path: data/races.json
  format: json
  fields:
  - name: next
    label: 次戦情報
    type: object
    fields:
    - name: round
      label: ラウンド
      type: string
    - name: date
      label: 日付
      type: string
      description: YYYY-MM-DD。未定は TBA。
    - name: circuit
      label: サーキット
      type: string
    - name: url
      label: 大会公式URL
      type: string
  - name: results
    label: レース結果
    type: object
    fields: &id001
    - name: round
      label: ラウンド
      type: string
    - name: date
      label: 日付
      type: string
      description: YYYY-MM-DD。未定は TBA。
    - name: circuit
      label: サーキット
      type: string
    - name: qualify
      label: 予選
      type: string
      description: 未発表は —。
    - name: race
      label: 決勝
      type: string
      description: 未発表は —。
    - name: point
      label: 獲得ポイント
      type: string
      description: 未発表は —。
    - name: url
      label: 詳細URL
      type: string
    description: 公式に確認できた結果のみ追加してください。
    list: true
  - name: schedule
    label: レース予定
    type: object
    fields: *id001
    description: 公式に確認できた開催日程のみ追加してください。
    list: true
- name: news
  label: 活動報告・ニュース
  type: file
  path: data/news.json
  format: json
  fields:
  - name: items
    label: 記事
    type: object
    fields:
    - name: slug
      label: 記事URLの名前（半角英数字・ハイフン）
      type: string
      required: true
      description: 例：sugo-report-2026。記事ごとに別の名前を設定し、公開後は変更しないでください。
    - name: published
      label: サイトへ掲載する
      type: boolean
      default: true
      description: OFFの記事は公開用サイト・JSON・サイトマップへ出力しません。ただし元データは公開GitHubと履歴から読めます。秘密の下書きは保存しないでください。
    - name: date
      label: 公開日
      type: date
      options:
        format: yyyy-MM-dd
      required: true
    - name: category
      label: カテゴリ
      type: select
      options:
        values:
        - label: 活動報告
          value: ACTIVITY
        - label: レース
          value: RACE
        - label: お知らせ
          value: INFORMATION
        - label: メディア
          value: MEDIA
    - name: title
      label: タイトル
      type: string
      required: true
    - name: description
      label: 冒頭の本文
      type: text
      description: 記事の冒頭に表示します。空行で段落を分けます。続きの文章や複数写真は下の「本文の文章・写真」で順番に追加します。
    - name: image
      label: サムネイル写真（任意）
      type: image
      description: 記事一覧と詳細冒頭に表示。写真を選んだら代替テキストも入力してください。未設定は空欄にします。
    - name: imageAlt
      label: サムネイルの代替テキスト
      type: string
      description: 写真に実際に写る内容を短く説明します。サムネイルを指定した場合は必須です。
    - name: imageCaption
      label: サムネイルの説明・クレジット（任意）
      type: string
    - name: url
      label: 関連記事URL
      type: string
      description: 任意の関連ページ。本文や写真を掲載する記事詳細ページは自動で作成されます。
    - name: featured
      label: 注目記事
      type: boolean
      default: false
    - name: isSample
      label: 仮原稿として表示する
      type: boolean
      default: false
      description: ONの間は仮原稿の表示が付きます。正式掲載する際にOFFにします。ONでも記事とデータは公開されます。
    - name: blocks
      label: 本文の文章・写真（順番に追加）
      type: object
      list: true
      description: 文章→写真→文章→写真など自由に並べます。写真は何枚でも追加できます。種類に合う欄へ入力してください。
      fields:
      - name: type
        label: 種類
        type: select
        required: true
        default: text
        options:
          values:
          - label: 文章
            value: text
          - label: 写真
            value: image
      - name: text
        label: 文章
        type: text
        description: 種類が「文章」のときに使用。HTMLタグは不要です。空行で段落を分けます。
      - name: image
        label: 写真
        type: image
        description: 種類が「写真」のときに選択。Mediaへアップロードした写真も選べます。
      - name: alt
        label: 写真の代替テキスト
        type: string
        description: 種類が「写真」のときに必須です。写っている内容を短く説明してください。
      - name: caption
        label: 写真の説明・撮影者クレジット
        type: text
        description: 掲載許諾で指定されたクレジットや写真の説明を入力します。
    description: 項目の追加・編集・削除で記事を管理します。保存先ブランチがmainの場合、GitHub Actionsの検証後に自動公開されます。公開処理の成功を確認してください。
    list: true
- name: sponsors
  label: スポンサー
  type: file
  path: data/sponsors.json
  format: json
  fields:
  - name: items
    label: スポンサー
    type: object
    fields:
    - name: name
      label: 名称
      type: string
    - name: category
      label: カテゴリ
      type: string
    - name: description
      label: 企業・取り組みの紹介文
      type: text
      description: 掲載許可のある公開用文章のみ。空欄でも掲載できます。
    - name: logo
      label: ロゴ
      type: image
      description: 実際の写真を選択してください。未設定は空欄にします。
    - name: url
      label: 公式URL
      type: string
    description: 掲載許可を得た実在のスポンサーのみ追加してください。
    list: true
- name: messages
  label: 応援メッセージ（公開用）
  type: file
  path: data/messages.json
  format: json
  fields:
  - name: items
    label: 掲載するメッセージ
    type: object
    description: 掲載同意を確認した公開用文章だけを追加します。下書き、非公開投稿、メール、電話、問い合わせ原文は保存しないでください。
    fields:
    - name: name
      label: 公開してよい表示名
      type: string
      required: true
    - name: message
      label: 掲載する応援メッセージ
      type: text
      required: true
    - name: date
      label: 掲載日（任意）
      type: date
      options:
        format: yyyy-MM-dd
      description: 掲載日のみ。未確認の日付や投稿者の個人情報は記入しません。
    list: true
- name: gallery
  label: ギャラリー
  type: file
  path: data/gallery.json
  format: json
  fields:
  - name: items
    label: ギャラリー写真
    type: object
    fields:
    - name: image
      label: PC用写真
      type: image
      description: 実際の写真を選択してください。未設定は空欄にします。
    - name: mobileImage
      label: スマートフォン用写真
      type: image
      description: 実際の写真を選択してください。未設定は空欄にします。
    - name: width
      label: PC用写真の幅（px・任意）
      type: number
      description: 画像ファイルの実際のピクセル幅。読み込み前の表示領域を確保します。未確認の場合は空欄にしてください。
    - name: height
      label: PC用写真の高さ（px・任意）
      type: number
      description: 画像ファイルの実際のピクセル高さ。幅とセットで入力してください。
    - name: mobileWidth
      label: スマートフォン用写真の幅（px・任意）
      type: number
      description: モバイル用画像の実際のピクセル幅。PCと同じ画像なら同じ値です。
    - name: mobileHeight
      label: スマートフォン用写真の高さ（px・任意）
      type: number
      description: モバイル用画像の実際のピクセル高さ。モバイル用の幅とセットで入力してください。
    - name: alt
      label: 写真の説明（読み上げ用）
      type: string
      description: 実際に写っている人物・マシン・場面を短く説明。
    - name: caption
      label: キャプション
      type: string
    description: 複数の項目に写真を選択して管理できます。未設定は空欄にします。
    list: true
